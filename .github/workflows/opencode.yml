name: opencode

# Answer /oc and /opencode mentions on issues and PR review comments with
# OpenCode, running in this repo's Actions runner.
#
# Billing: uses an OpenCode Go subscription. The action runs OpenCode itself, so
# it is a validated OpenCode client - Go's x-opencode-session requirement is
# satisfied by the CLI, and usage draws on the Go plan's monthly allowance
# instead of pay-as-you-go credit (see opencode.ai/v2/docs/console/go).
#
# Setup: add a Console personal API key as the OPENCODE_API_KEY secret
# (Settings -> Secrets and variables -> Actions). Nothing else is required: no
# GitHub App install, because use_github_token passes GITHUB_TOKEN instead of
# exchanging an OIDC token.
#
# Unlike the docs' sample, this only fires for OWNER/MEMBER/COLLABORATOR
# comments. The repo is public, so an unguarded /oc lets any passer-by spend the
# Go allowance.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # OpenCode only sets these itself in OIDC mode; with use_github_token the
      # workflow owns the git identity used for any commit it makes.
      - name: Set git identity
        run: |
          git config --global user.name "opencode[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # opencode-go/<model> resolves through the registry OpenCode ships
          # (models.dev): provider opencode-go, base URL
          # https://opencode.ai/inference/go/openai/v1.
          # Good picks on the Go plan:
          #   opencode-go/kimi-k2.7-code   $0.95/$4  per M, 262k ctx  - code agent
          #   opencode-go/glm-5.3-flash    $0.15/$0.50 per M, 1M ctx   - cheap
          #   opencode-go/deepseek-v4.1-flash $0.15/$0.60, 1M ctx     - cheap
          #   opencode-go/muse-spark-1.3-contributor $0.10/$0.20      - cheapest
          model: opencode-go/kimi-k2.7-code
          use_github_token: true
          prompt: |
            You are working in the WildKernels GKI kernel CI repository.
            Kernel sources are synced into kernels/ at build time and are NOT
            committed here - everything in .github/ is the build logic.
            - Workflow YAML must stay valid and every shell block must pass `bash -n`.
            - There is a validator: python3 .github/scripts/validate_workflows.py
              Run it before proposing changes.
            - Multi-line config lists are applied with scripts/config through
              .github/actions/set-kernel-config; never reintroduce sed patching of
              gki_defconfig.
            - Kernel builds are expensive (80-job sweeps). Do not dispatch a
              workflow run; open a PR and let the maintainer decide.
